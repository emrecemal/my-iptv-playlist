name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically once a day (at midnight UTC)
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write # Grants permissions needed to commit and push back to repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update script
        run: python update_playlist.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u
          git diff-index --quiet HEAD || git commit -m "Auto-update playlist"
          git push
